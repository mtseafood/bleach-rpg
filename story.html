<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>死神 BLEACH RPG — 離線劇情版</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-dark:#0a0a0f; --bg-panel:#111118; --bg-card:#16161f; --bg-input:#1a1a25;
    --border:#2a2a3a; --accent:#ff6b00; --accent2:#ffaa00; --accent-dim:#7a3300;
    --text:#e8e8f0; --text-dim:#7a7a9a; --text-muted:#4a4a6a;
    --hp:#e05050; --mp:#4090ff; --sta:#40c060; --gold:#d4a820; --spirit:#7ec8ff;
  }

  html, body { height:100%; background:var(--bg-dark); color:var(--text);
    font-family:'Segoe UI','Noto Sans TC','Hiragino Kaku Gothic Pro',sans-serif; overflow:hidden; }

  #app { display:grid; grid-template-columns:260px 1fr; grid-template-rows:56px 1fr; height:100vh; }

  /* HEADER */
  #header { grid-column:1/-1; display:flex; align-items:center; padding:0 20px; gap:16px;
    background:#0d0d16; border-bottom:1px solid var(--border); z-index:10; }
  .logo-kanji { font-size:22px; font-weight:900; color:var(--accent); text-shadow:0 0 12px var(--accent); }
  .logo-text { font-size:13px; font-weight:700; }
  .logo-sub { font-size:9px; color:var(--text-dim); letter-spacing:3px; text-transform:uppercase; }
  .header-sep { flex:1; }
  .hbtn { background:transparent; border:1px solid var(--border); color:var(--text-dim);
    padding:6px 14px; border-radius:4px; cursor:pointer; font-size:12px; letter-spacing:1px; transition:all .2s; }
  .hbtn:hover { border-color:var(--accent); color:var(--accent); }
  .hbtn.danger { border-color:#442222; color:#cc5555; }
  .hbtn.danger:hover { border-color:#cc2222; color:#ff4444; }

  /* SIDEBAR */
  #sidebar { background:var(--bg-panel); border-right:1px solid var(--border);
    overflow-y:auto; padding:14px 12px; display:flex; flex-direction:column; gap:10px; }
  #sidebar::-webkit-scrollbar { width:4px; }
  #sidebar::-webkit-scrollbar-thumb { background:#2a2a3a; border-radius:2px; }

  .scard { background:var(--bg-card); border:1px solid var(--border); border-radius:6px; padding:12px; }
  .stitle { font-size:9px; letter-spacing:3px; text-transform:uppercase; color:var(--text-muted);
    margin-bottom:10px; display:flex; align-items:center; gap:6px; }
  .stitle::after { content:''; flex:1; height:1px; background:var(--border); }

  .char-name { font-size:18px; font-weight:700; }
  .char-meta { font-size:11px; color:var(--text-dim); margin-top:4px; }
  .char-badge { display:inline-block; background:var(--accent-dim); color:var(--accent);
    font-size:10px; padding:2px 8px; border-radius:10px; margin-top:6px; border:1px solid var(--accent-dim); }

  .stat-row { display:flex; align-items:center; gap:8px; margin-bottom:7px; }
  .stat-label { font-size:10px; color:var(--text-dim); width:28px; flex-shrink:0; }
  .bar-bg { flex:1; height:6px; background:#1a1a2a; border-radius:3px; overflow:hidden; }
  .bar-fill { height:100%; border-radius:3px; transition:width .6s; }
  .bar-fill.hp { background:linear-gradient(90deg,#8b0000,var(--hp)); }
  .bar-fill.mp { background:linear-gradient(90deg,#003380,var(--mp)); }
  .bar-fill.sta { background:linear-gradient(90deg,#005520,var(--sta)); }
  .stat-val { font-size:10px; color:var(--text-dim); width:34px; text-align:right; flex-shrink:0; }

  .trait-row { display:flex; justify-content:space-between; align-items:center; font-size:11px;
    padding:5px 0; border-bottom:1px solid #1a1a2a; }
  .trait-row:last-child { border-bottom:none; }
  .trait-name { color:var(--text-dim); }
  .trait-val { font-weight:700; font-size:12px; color:var(--accent2); }
  .trait-val.spirit { color:var(--spirit); }
  .trait-val.gold { color:var(--gold); }

  .reiatsu-box { text-align:center; padding:6px 0; }
  .reiatsu-num { font-size:24px; font-weight:900; color:var(--gold); text-shadow:0 0 12px rgba(212,168,32,.5); line-height:1; }
  .reiatsu-label { font-size:9px; color:var(--text-muted); letter-spacing:2px; margin-top:4px; }

  .zan-name { font-size:16px; font-weight:700; color:var(--gold); text-shadow:0 0 8px rgba(212,168,32,.4); }
  .zan-state { font-size:10px; margin-top:4px; letter-spacing:1px; }
  .zan-state.sealed { color:var(--text-muted); }
  .zan-state.shikai { color:var(--accent2); text-shadow:0 0 8px rgba(255,170,0,.4); }
  .zan-state.bankai { color:#ff8030; text-shadow:0 0 10px rgba(255,128,48,.6); font-weight:700; }
  .zan-state.true { color:#ffe680; text-shadow:0 0 14px rgba(255,230,128,.8); font-weight:700; }

  .event-item { font-size:11px; color:var(--text-dim); padding:5px 0; border-bottom:1px solid #1a1a28; line-height:1.5; }
  .event-item:last-child { border-bottom:none; }
  .dot { display:inline-block; width:5px; height:5px; background:var(--accent); border-radius:50%; margin-right:6px; vertical-align:middle; }

  .progress-track { display:flex; flex-direction:column; gap:6px; }
  .pnode { display:flex; align-items:center; gap:8px; font-size:11px; }
  .pnode .pmark { width:8px; height:8px; border-radius:50%; border:1px solid var(--border); flex-shrink:0; }
  .pnode.done .pmark { background:var(--accent); border-color:var(--accent); }
  .pnode.current .pmark { background:var(--accent2); border-color:var(--accent2); box-shadow:0 0 8px var(--accent2); }
  .pnode.done .ptext, .pnode.current .ptext { color:var(--text); }
  .pnode .ptext { color:var(--text-muted); }

  /* MAIN */
  #main { display:flex; flex-direction:column; overflow:hidden; background:var(--bg-dark); }

  /* Scene header bar */
  #scene-bar { display:flex; gap:18px; padding:10px 24px; background:#0d0d16;
    border-bottom:1px solid var(--border); font-size:11px; color:var(--text-dim); flex-wrap:wrap; }
  .scene-item { display:flex; gap:5px; align-items:center; }
  .scene-item .sk { color:var(--text-muted); letter-spacing:1px; }
  .scene-item .sv { color:var(--accent2); }

  #story { flex:1; overflow-y:auto; padding:24px 28px 12px; }
  #story::-webkit-scrollbar { width:5px; }
  #story::-webkit-scrollbar-thumb { background:#2a2a3a; border-radius:3px; }

  .scene-text { max-width:780px; margin:0 auto; }
  .scene-text p { font-size:15px; line-height:2.0; margin-bottom:16px; color:var(--text); }
  .scene-text p.narration { color:#d8d8e8; }
  .scene-text p.dialog { color:#fff; padding-left:16px; border-left:2px solid var(--accent-dim); }
  .scene-text p.thought { color:#9090b0; font-style:italic; }
  .scene-text p.spirit-line { color:var(--spirit); padding-left:16px; border-left:2px solid #2a5a7a; }
  .scene-text .emph { color:var(--accent2); font-weight:600; }
  .scene-text .danger-text { color:var(--hp); font-weight:700; text-shadow:0 0 6px rgba(224,80,80,.4); }
  .scene-text h2 { font-size:20px; color:var(--accent); text-align:center; margin:8px 0 24px;
    letter-spacing:4px; text-shadow:0 0 14px rgba(255,107,0,.4); }
  .scene-text .chapter-tag { text-align:center; font-size:11px; letter-spacing:6px;
    color:var(--text-muted); text-transform:uppercase; margin-bottom:6px; }

  .feedback { max-width:780px; margin:0 auto 16px; padding:10px 16px; border-radius:6px;
    font-size:13px; background:#0f1a10; border:1px solid #1d3a22; color:#7fc890; }
  .feedback.bad { background:#1a0f0f; border-color:#3a1d1d; color:#cc7777; }
  .feedback.neutral { background:#0f0f1a; border-color:#252540; color:#8888aa; }
  .feedback .fk { font-weight:700; }

  /* CHOICES */
  #choices { max-width:780px; margin:0 auto; padding:4px 28px 28px; display:flex; flex-direction:column; gap:10px; }
  .choice {
    background:var(--bg-card); border:1px solid var(--border); border-radius:8px;
    padding:14px 18px; cursor:pointer; transition:all .2s; text-align:left; color:var(--text);
    font-size:14px; line-height:1.6; position:relative; display:flex; gap:12px; align-items:flex-start;
  }
  .choice:hover { border-color:var(--accent); background:#1a1108; transform:translateX(4px); }
  .choice .cnum { color:var(--accent); font-weight:700; flex-shrink:0; font-size:13px; }
  .choice .ctext { flex:1; }
  .choice .ctag { font-size:11px; color:var(--text-muted); margin-top:3px; }
  .choice.req-locked { opacity:.4; cursor:not-allowed; }
  .choice.req-locked:hover { border-color:var(--border); background:var(--bg-card); transform:none; }
  .choice.special { border-color:#2a4a6a; }
  .choice.special:hover { border-color:var(--spirit); background:#0a1620; }
  .choice.special .cnum { color:var(--spirit); }

  .continue-btn {
    max-width:780px; margin:0 auto; display:block; width:calc(100% - 56px);
    background:var(--accent); border:none; color:#fff; font-size:15px; font-weight:700;
    padding:15px; border-radius:8px; cursor:pointer; letter-spacing:3px; transition:all .2s;
  }
  .continue-btn:hover { background:var(--accent2); transform:translateY(-2px); box-shadow:0 6px 20px rgba(255,107,0,.25); }

  /* COMBAT */
  .combat { max-width:780px; margin:0 auto; }
  .combat-enemy, .combat-player { background:var(--bg-card); border:1px solid var(--border); border-radius:8px; padding:14px 16px; margin-bottom:12px; }
  .combat-enemy { border-color:#5a2222; }
  .combat-player { border-color:#2a3a5a; }
  .cb-name { font-size:15px; font-weight:700; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; }
  .cb-enemy-name { color:#e07070; }
  .cb-player-name { color:var(--accent2); }
  .cb-tag { font-size:11px; color:var(--text-dim); font-weight:400; }
  .cb-hpbar-bg { height:14px; background:#1a1a2a; border-radius:7px; overflow:hidden; }
  .cb-hpbar { height:100%; transition:width .4s; }
  .cb-hpbar.enemy { background:linear-gradient(90deg,#7a1010,#e05050); }
  .cb-hpbar.player { background:linear-gradient(90deg,#8b0000,#e05050); }
  .cb-mpbar-bg { height:8px; background:#1a1a2a; border-radius:4px; overflow:hidden; margin-top:7px; }
  .cb-mpbar { height:100%; background:linear-gradient(90deg,#003380,#4090ff); transition:width .4s; }
  .cb-hptext { font-size:11px; color:var(--text-dim); text-align:right; margin-top:3px; }
  .cb-intent { font-size:12px; color:#e0a050; margin-top:8px; }
  .cb-intent.danger { color:#ff5555; font-weight:700; }
  .combat-log { background:#0d0d16; border:1px solid var(--border); border-radius:8px; padding:12px 16px; margin-bottom:14px; min-height:92px; max-height:168px; overflow-y:auto; font-size:13px; line-height:1.7; }
  .combat-log::-webkit-scrollbar { width:4px; }
  .combat-log::-webkit-scrollbar-thumb { background:#2a2a3a; border-radius:2px; }
  .cb-log-line { margin-bottom:4px; color:var(--text-dim); }
  .cb-log-line.you { color:#7ec8ff; }
  .cb-log-line.enemy { color:#e08080; }
  .cb-log-line.crit { color:var(--accent2); font-weight:700; }
  .cb-log-line.heal { color:#70d090; }
  .cb-log-line.system { color:var(--text-muted); }
  .combat-actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .cb-action { background:var(--bg-card); border:1px solid var(--border); border-radius:8px; padding:11px 14px; cursor:pointer; transition:all .15s; text-align:left; color:var(--text); }
  .cb-action:hover:not(:disabled) { border-color:var(--accent); background:#1a1108; transform:translateY(-1px); }
  .cb-action:disabled { opacity:.35; cursor:not-allowed; }
  .cb-act-name { font-weight:700; font-size:14px; }
  .cb-act-desc { font-size:11px; color:var(--text-muted); margin-top:2px; }
  .cb-action.release { border-color:var(--gold); }
  .cb-action.release:hover:not(:disabled) { background:#1a1505; border-color:var(--accent2); }
  .cb-action.hollow { border-color:#7a3a9a; }
  .cb-action.hollow:hover:not(:disabled) { background:#16081a; border-color:#c060e0; }
  .cb-action.hollow .cb-act-name { color:#c878e0; }
  .cb-victory, .cb-defeat { text-align:center; padding:18px; border-radius:8px; margin-bottom:14px; animation:fadeIn .4s; }
  .cb-victory { background:#0f1a10; border:1px solid #1d5030; color:#8fd8a0; }
  .cb-defeat { background:#1a0808; border:1px solid #5a2222; color:#dd8888; }

  /* DIFFICULTY PICKER */
  .diff-picker { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:4px; }
  .diff-btn { background:var(--bg-input); border:1px solid var(--border); border-radius:6px; padding:10px 8px; cursor:pointer; transition:all .15s; text-align:center; }
  .diff-btn:hover { border-color:var(--accent); }
  .diff-btn.active { border-color:var(--accent); background:#1a1108; }
  .diff-name { font-size:14px; font-weight:700; color:var(--text); }
  .diff-btn.active .diff-name { color:var(--accent2); }
  .diff-desc { font-size:10px; color:var(--text-muted); margin-top:3px; line-height:1.3; }

  /* COMBAT ITEMS + RANK */
  .cb-rank { font-size:40px; font-weight:900; line-height:1; margin-bottom:4px; }
  .cb-rank.S { color:#ffd24a; text-shadow:0 0 16px rgba(255,210,74,.7); }
  .cb-rank.A { color:#ff8030; text-shadow:0 0 12px rgba(255,128,48,.5); }
  .cb-rank.B { color:#7ec8ff; }
  .cb-rank.C { color:var(--text-dim); }
  .cb-reward { font-size:12px; color:#8fd8a0; margin-top:6px; }
  .cb-action.item { border-color:#2a5a4a; }
  .cb-action.item:hover:not(:disabled) { border-color:#40c090; background:#08160f; }
  .cb-action.item .cb-act-name { color:#6fd0a0; }
  .cb-action.back { border-color:#3a3a4a; }

  /* GENERIC PANEL MODAL (achievements / arena) */
  #panel-overlay { position:fixed; inset:0; background:rgba(0,0,0,.9); backdrop-filter:blur(8px);
    display:flex; align-items:center; justify-content:center; z-index:1100; }
  #panel-overlay.hidden { display:none; }
  .panel { background:var(--bg-panel); border:1px solid var(--border); border-radius:12px;
    padding:28px 32px; width:560px; max-width:95vw; max-height:88vh; overflow-y:auto; animation:slideUp .35s ease; }
  .panel::-webkit-scrollbar { width:5px; } .panel::-webkit-scrollbar-thumb { background:#2a2a3a; border-radius:3px; }
  .panel h2 { font-size:20px; color:var(--accent); text-align:center; letter-spacing:3px; margin-bottom:6px; }
  .panel .psub { text-align:center; font-size:12px; color:var(--text-dim); margin-bottom:20px; }
  .panel-close { width:100%; background:var(--bg-input); border:1px solid var(--border); color:var(--text-dim);
    padding:11px; border-radius:6px; cursor:pointer; letter-spacing:2px; margin-top:18px; transition:all .2s; }
  .panel-close:hover { border-color:var(--accent); color:var(--accent); }

  .ach-item { display:flex; gap:12px; align-items:center; padding:11px 14px; border:1px solid var(--border);
    border-radius:8px; margin-bottom:8px; background:var(--bg-card); }
  .ach-item.locked { opacity:.45; }
  .ach-icon { font-size:22px; width:30px; text-align:center; flex-shrink:0; }
  .ach-body { flex:1; }
  .ach-title { font-size:14px; font-weight:700; color:var(--text); }
  .ach-item.locked .ach-title { color:var(--text-dim); }
  .ach-desc { font-size:11px; color:var(--text-muted); margin-top:2px; }
  .ach-done { color:#8fd8a0; font-size:11px; font-weight:700; }

  .arena-opt { display:flex; justify-content:space-between; align-items:center; padding:14px 16px;
    border:1px solid var(--border); border-radius:8px; margin-bottom:10px; background:var(--bg-card);
    cursor:pointer; transition:all .15s; }
  .arena-opt:hover { border-color:var(--accent); background:#1a1108; transform:translateX(3px); }
  .arena-opt .ao-name { font-size:15px; font-weight:700; color:var(--accent2); }
  .arena-opt .ao-desc { font-size:11px; color:var(--text-muted); margin-top:3px; }
  .arena-opt .ao-tier { font-size:20px; font-weight:900; color:var(--gold); }
  .inv-line { display:flex; gap:14px; justify-content:center; font-size:12px; color:var(--text-dim); margin:14px 0; }
  .inv-line b { color:var(--accent2); }

  .ach-toast { position:fixed; right:20px; bottom:20px; z-index:2000; display:flex; gap:12px; align-items:center;
    background:var(--bg-panel); border:1px solid var(--accent); border-radius:10px; padding:12px 18px;
    box-shadow:0 6px 24px rgba(0,0,0,.5); transform:translateX(140%); transition:transform .4s cubic-bezier(.2,.8,.2,1); }
  .ach-toast.show { transform:translateX(0); }

  /* MODAL */
  #modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.9); backdrop-filter:blur(8px);
    display:flex; align-items:center; justify-content:center; z-index:1000; }
  #modal-overlay.hidden { display:none; }
  .modal { background:var(--bg-panel); border:1px solid var(--border); border-radius:12px;
    padding:40px; width:520px; max-width:95vw; animation:slideUp .4s ease; }
  @keyframes slideUp { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }

  .modal-logo { text-align:center; margin-bottom:24px; }
  .modal-kanji { font-size:56px; font-weight:900; color:var(--accent); text-shadow:0 0 36px var(--accent); display:block; line-height:1; }
  .modal-tagline { font-size:10px; letter-spacing:5px; color:var(--text-muted); text-transform:uppercase; margin-top:8px; display:block; }
  .modal-tagline2 { font-size:13px; color:var(--text-dim); margin-top:14px; line-height:1.7; }

  .free-badge { display:inline-flex; align-items:center; gap:6px; background:#0a2010;
    border:1px solid #1a5030; color:#40c060; font-size:11px; padding:5px 14px; border-radius:20px; margin:18px 0; }
  .free-badge::before { content:'●'; font-size:7px; }

  .modal label { display:block; font-size:10px; letter-spacing:2px; text-transform:uppercase;
    color:var(--text-muted); margin:18px 0 8px; }
  .modal input { width:100%; background:var(--bg-input); border:1px solid var(--border); border-radius:6px;
    color:var(--text); font-size:15px; padding:12px 14px; outline:none; transition:border-color .2s; }
  .modal input:focus { border-color:var(--accent); }

  .modal-btn { width:100%; background:var(--accent); border:none; color:#fff; font-size:15px; font-weight:700;
    padding:14px; border-radius:8px; cursor:pointer; letter-spacing:3px; text-transform:uppercase;
    transition:all .2s; margin-top:24px; }
  .modal-btn:hover { background:var(--accent2); box-shadow:0 0 24px rgba(255,107,0,.3); }

  .fade-in { animation:fadeIn .5s ease; }
  @keyframes fadeIn { from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)} }

  @media(max-width:700px){
    #app { grid-template-columns:1fr; }
    #sidebar { display:none; }
    #story { padding:16px; }
    #choices { padding:4px 16px 20px; }
    .scene-text p { font-size:14px; line-height:1.85; }
  }
</style>
</head>
<body>

<!-- START MODAL -->
<div id="modal-overlay">
  <div class="modal">
    <div class="modal-logo">
      <span class="modal-kanji">死神</span>
      <span class="modal-tagline">BLEACH RPG — 離線劇情版</span>
      <div class="modal-tagline2">一場關於靈魂、刀刃與覺悟的冒險。<br>你的每一個選擇，都會改變故事的走向。</div>
    </div>
    <div style="text-align:center"><span class="free-badge">完全免費 · 無需金鑰 · 無需網路</span></div>
    <label for="name-input">輸入你的名字</label>
    <input type="text" id="name-input" placeholder="例如：黑崎、藤宮、白井…" maxlength="12" value="">
    <label style="margin-top:18px">選擇難度（影響戰鬥）</label>
    <div class="diff-picker" id="diff-picker">
      <button class="diff-btn" data-diff="easy" onclick="pickDiff('easy')">
        <div class="diff-name">見習</div><div class="diff-desc">敵人較弱・輕鬆體驗劇情</div></button>
      <button class="diff-btn active" data-diff="normal" onclick="pickDiff('normal')">
        <div class="diff-name">死神</div><div class="diff-desc">標準平衡的戰鬥體驗</div></button>
      <button class="diff-btn" data-diff="hard" onclick="pickDiff('hard')">
        <div class="diff-name">修羅</div><div class="diff-desc">敵人強悍・考驗戰術</div></button>
    </div>
    <button class="modal-btn" onclick="startGame()">⚔ 開始第一章</button>
  </div>
</div>

<!-- GENERIC PANEL (achievements / arena) -->
<div id="panel-overlay" class="hidden"><div class="panel" id="panel-body"></div></div>

<!-- APP -->
<div id="app">
  <header id="header">
    <span class="logo-kanji">死神</span>
    <div>
      <div class="logo-text">BLEACH RPG</div>
      <div class="logo-sub">離線劇情版 · Chapter Mode</div>

      {t:'dialog', x:'「我知道你想問什麼。霜月凛那丫頭，被押回尸魂界了。」黑丸玄收起笑容，扇子一合，「『將力量授予人類』這條罪，在中央四十六室眼裡可不輕。照他們一貫的作風……她大概只剩<danger>一個月不到的時間</danger>，就會被押上刑場。」'},
      {t:'n', x:'你掙扎著想坐起來，牽動傷口，痛得倒抽一口氣。'},
      {t:'dialog', x:'「別急。」黑丸玄按住你，目光忽然變得銳利如鷹，「你現在這副半死不活的樣子衝去尸魂界，只是給人添一具屍體。你體內凛的力量，被白羽那一刀斬得七零八落，正在崩解——這也是你剛才差點沒命的真正原因。」'},
      {t:'dialog', x:'「但是呢……」他咧嘴一笑，那笑容裡藏著某種瘋狂的期待，「我有辦法。讓你拋掉那份『借來的力量』，把你自己<emph>真正的死神之力</emph>，從靈魂最深處挖出來。代價是——這個過程，痛得足以讓你死上好幾回。怎麼樣，要試試嗎？」'}

/* ════════════════════════════════════════════════════════
   ENGINE
════════════════════════════════════════════════════════ */
let pendingDiff = 'normal';
function pickDiff(d) {
  pendingDiff = d;
  document.querySelectorAll('.diff-btn').forEach(b => b.classList.toggle('active', b.dataset.diff === d));
}

function startGame() {
  const name = document.getElementById('name-input').value.trim() || '黑崎';
  S.name = name;
  S.difficulty = pendingDiff;
  localStorage.setItem('bleach_story_save', JSON.stringify(S));
  document.getElementById('modal-overlay').classList.add('hidden');
  renderNode('c1_00');
}

function applyFx(fx, flag) {
  if (!fx) return;
  for (const k of ['hp','mp','sta']) {
    if (fx[k] !== undefined) S[k] = Math.max(0, Math.min(100, S[k] + fx[k]));
  }
  for (const k of ['courage','calm','sense','bond']) {
    if (fx[k] !== undefined) S[k] += fx[k];
  }
  if (flag) Object.assign(S.flags, flag);
}

function reqMet(req) {
  if (!req) return true;
  for (const k in req) { if ((S[k] || 0) < req[k]) return false; }
  return true;
}

function renderNode(id) {
  const node = STORY[id];
  if (!node) return;
  S.node = id;
  if (!S.visited.includes(id)) S.visited.push(id);

  // node-enter state
  if (node.restore) { S.hp = 100; S.mp = 100; S.sta = 100; }
  if (node.unlockHollow) S.hollowUnlocked = true;
  if (node.setState) { for (const k of ['hp','mp','sta','reiatsu','zanName','zanState']) if (node.setState[k] !== undefined) S[k] = node.setState[k]; }
  if (node.reiatsuSet) S.reiatsu = node.reiatsuSet;
  if (node.badge) S.badge = node.badge;
  if (node.charMeta) S.charMeta = node.charMeta;

  // 成就檢查
  if (S.zanState === 'bankai') unlockAch('bankai');
  if (S.zanState === 'true') { unlockAch('bankai'); unlockAch('truebankai'); }
  if (S.hollowUnlocked) unlockAch('vizard');
  if (S.bond >= 14) unlockAch('bondMax');
  if (id === 'c7_end') unlockAch('clear');

  localStorage.setItem('bleach_story_save', JSON.stringify(S));

  // scene bar
  setText('sc-time', node.time || '—');
  setText('sc-place', node.place || '—');
  setText('sc-rei', node.rei || '—');

  // story text
  const story = document.getElementById('story');
  story.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'scene-text fade-in';

  // feedback banner
  if (node.fb) {
    const fb = document.createElement('div');
    fb.className = 'feedback ' + (node.fb.type === 'bad' ? 'bad' : node.fb.type === 'neutral' ? 'neutral' : '');
    fb.innerHTML = node.fb.v;
    story.appendChild(fb);
  }

  renderSegs(node.text, wrap);
  story.appendChild(wrap);

  // world events
  if (node.events) {
    document.getElementById('world-events').innerHTML =
      node.events.map(e => `<div class="event-item"><span class="dot"></span>${e}</div>`).join('');
  }

  updateSidebar(node);
  renderChoices(node);
  story.scrollTop = 0;
}

/* 條件式劇情段落：依旗標／數值選擇分支文字 */
const SEG_CONDS = {
  read:     () => !!S.flags.c2_read,
  askWhy:   () => !!S.flags.c2_askWhy,
  silent:   () => !!S.flags.c2_silent,
  bondHigh: () => S.bond >= 8,
  unbroken: () => !!S.flags.c2_unbroken,
  shield:   () => !!S.flags.c2_shield,
  bondMax:  () => S.bond >= 14
};

function transformText(s) {
  return s
    .replace(/<NAME>/g, `<span class="emph">${S.name}</span>`)
    .replace(/<emph>/g, '<span class="emph">').replace(/<\/emph>/g, '</span>')
    .replace(/<danger>/g, '<span class="danger-text">').replace(/<\/danger>/g, '</span>');
}

function renderSegs(segs, wrap) {
  segs.forEach(seg => {
    if (seg.t === 'cond') {
      // pick first matching condition key, else 'def'
      let chosen = null;
      for (const key of Object.keys(seg)) {
        if (key === 't' || key === 'def') continue;
        if (SEG_CONDS[key] && SEG_CONDS[key]()) { chosen = seg[key]; break; }
      }
      if (!chosen) chosen = seg.def || [];
      renderSegs(chosen, wrap);
      return;
    }
    let el;
    if (seg.t === 'chapter') { el = document.createElement('div'); el.className = 'chapter-tag'; el.textContent = seg.x; }
    else if (seg.t === 'h2') { el = document.createElement('h2'); el.textContent = seg.x; }
    else {
      el = document.createElement('p');
      const cls = { n:'narration', dialog:'dialog', think:'thought', spirit:'spirit-line' }[seg.t] || 'narration';
      el.className = cls;
      el.innerHTML = transformText(seg.x);
    }
    wrap.appendChild(el);
  });
}

function renderChoices(node) {
  const box = document.getElementById('choices');
  box.innerHTML = '';
  node.choices.forEach((ch, i) => {
    const locked = !reqMet(ch.req);
    const btn = document.createElement('button');
    btn.className = 'choice' + (locked ? ' req-locked' : '');
    const note = locked ? `<div class="ctag">🔒 此刻的你，還無法做出這個選擇</div>` : '';
    btn.innerHTML = `<span class="cnum">${i+1}.</span><span class="ctext">${ch.c}${note}</span>`;
    if (!locked) {
      if (node.battle && !ch.to.startsWith('__')) {
        btn.onclick = () => { applyFx(ch.fx, ch.flag); startBattle(node.battle, ch.to); };
      } else {
        btn.onclick = () => choose(ch);
      }
    }
    box.appendChild(btn);
  });
}

/* ════════════════════════════════════════════════════════
   COMBAT ENGINE — 回合制戰鬥
════════════════════════════════════════════════════════ */
let B = null;
const FORM_LABEL = { sealed:'封印', shikai:'始解', bankai:'卍解', 'true':'真・卍解' };
const FORM_RANK  = { sealed:0, shikai:1, bankai:2, 'true':3 };
const REL_MULT   = { shikai:1.4, bankai:1.8, 'true':2.3 };
const REL_NAME   = { shikai:'始解・曙', bankai:'卍解・煌天輪', 'true':'真・卍解・天照' };

function rand(a,b){ return a + Math.random()*(b-a); }
function critChance(){ return Math.min(0.40, 0.05 + S.sense*0.012); }
function dodgeChance(){ return Math.min(0.80, 0.40 + S.sense*0.022); }
function playerAtk(){ return 18 + Math.floor(S.courage*0.5) + Math.floor(S.sense*0.25); }
function canRelease(form){ return FORM_RANK[S.zanState] >= FORM_RANK[form]; }

function startBattle(bat, winTo){
  const pMax = Math.min(220, 90 + S.courage);
  const df = DIFF[S.difficulty] || DIFF.normal;
  const ehp = Math.round(bat.enemy.hp * df.ehp);
  B = {
    bat,
    enemy: { name:bat.enemy.name, hp:ehp, maxHp:ehp, atk:bat.enemy.atk * df.eatk,
             specialMult:bat.enemy.specialMult||2, specialEvery:bat.enemy.specialEvery||3,
             special:bat.enemy.special||'強力一擊', charging:false },
    pHp: pMax, pMax, pMp: 100,
    form: 'sealed', atkMul: 1, releaseUsed: false,
    hollowOn:false, hollowTurns:0, hollowCD:0,
    focus:false, dmgTaken:0, itemMenu:false,
    guard:false, dodgePend:false, turn:0, log:[], win:winTo, over:false
  };
  B.log.push({ c:'system', t: bat.intro || '戰鬥開始！' });
  renderBattle();
}

function renderBattle(){
  const e = B.enemy;
  const ePct = Math.max(0, Math.round(e.hp / e.maxHp * 100));
  const pPct = Math.max(0, Math.round(B.pHp / B.pMax * 100));
  const mpPct = Math.max(0, Math.round(B.pMp));
  let intent = '';
  if (e.charging) intent = `<div class="cb-intent danger">⚠ ${e.name} 蓄力完成——下一擊將造成巨大傷害！</div>`;
  const logHtml = B.log.slice(-7).map(l => `<div class="cb-log-line ${l.c||''}">${l.t}</div>`).join('');
  document.getElementById('story').innerHTML = `
    <div class="combat fade-in">
      <div class="combat-enemy">
        <div class="cb-name"><span class="cb-enemy-name">${e.name}</span><span class="cb-tag">敵</span></div>
        <div class="cb-hpbar-bg"><div class="cb-hpbar enemy" style="width:${ePct}%"></div></div>
        <div class="cb-hptext">HP ${Math.max(0,Math.round(e.hp))} / ${e.maxHp}</div>
        ${intent}
      </div>
      <div class="combat-log">${logHtml}</div>
      <div class="combat-player">
        <div class="cb-name"><span class="cb-player-name">${S.name}</span><span class="cb-tag">${FORM_LABEL[B.form]}${B.hollowOn?' <span style="color:#c060e0">・虛面('+B.hollowTurns+')</span>':''}</span></div>
        <div class="cb-hpbar-bg"><div class="cb-hpbar player" style="width:${pPct}%"></div></div>
        <div class="cb-hptext">HP ${Math.max(0,Math.round(B.pHp))} / ${B.pMax}</div>
        <div class="cb-mpbar-bg"><div class="cb-mpbar" style="width:${mpPct}%"></div></div>
        <div class="cb-hptext">靈力 ${Math.round(B.pMp)} / 100</div>
      </div>
    </div>`;
  const story = document.getElementById('story');
  const logEl = story.querySelector('.combat-log');
  if (logEl) logEl.scrollTop = logEl.scrollHeight;
  if (!B.over) renderBattleActions();
}

function mkBtn(name, desc, dis, cls, fn){
  const b = document.createElement('button');
  b.className = 'cb-action ' + (cls||'');
  b.disabled = !!dis;
  b.innerHTML = `<div class="cb-act-name">${name}</div><div class="cb-act-desc">${desc}</div>`;
  if (!dis) b.onclick = fn;
  return b;
}

function renderBattleActions(){
  const box = document.getElementById('choices');
  box.innerHTML = '';
  const grid = document.createElement('div');
  grid.className = 'combat-actions';

  if (B.itemMenu) {
    ['heal','mp','focus'].forEach(k => {
      const info = ITEM_INFO[k]; const n = S.items[k] || 0;
      grid.appendChild(mkBtn(`${info.icon} ${info.name} ×${n}`, info.desc, n <= 0, 'item', () => useItem(k)));
    });
    grid.appendChild(mkBtn('← 返回', '回到行動選單', false, 'back', () => { B.itemMenu = false; renderBattle(); }));
    box.appendChild(grid);
    return;
  }

  const acts = [
    { name:'斬擊', desc:'基礎攻擊・回復少量靈力', fn:()=>act('basic') },
    { name:'鬼道', desc:'消耗 25 靈力・強力攻擊', dis:B.pMp<25, fn:()=>act('skill') }
  ];
  if (B.bat.release && !B.releaseUsed && canRelease(B.bat.release)) {
    acts.push({ name:'解放 '+REL_NAME[B.bat.release], desc:'消耗 20 靈力・大幅強化＋回復', cls:'release', dis:B.pMp<20, fn:()=>act('release') });
  }
  if (S.hollowUnlocked && !B.hollowOn && B.hollowCD === 0) {
    acts.push({ name:'虛面解放', desc:'消耗 30 靈力・攻擊×1.6＋吸血，數回合後碎裂反噬', cls:'hollow', dis:B.pMp<30, fn:()=>act('hollow') });
  }
  acts.push({ name:'防禦', desc:'大幅減傷・回復靈力與體力', fn:()=>act('guard') });
  acts.push({ name:'閃避', desc:'有機率完全迴避下一擊', fn:()=>act('dodge') });
  const totalItems = (S.items.heal||0) + (S.items.mp||0) + (S.items.focus||0);
  acts.push({ name:`道具 (${totalItems})`, desc:'使用消耗品・消耗一回合', cls:'item', dis:totalItems<=0, fn:()=>{ B.itemMenu = true; renderBattle(); } });

  acts.forEach(a => grid.appendChild(mkBtn(a.name, a.desc, a.dis, a.cls, a.fn)));
  box.appendChild(grid);
}

function useItem(k){
  if ((S.items[k]||0) <= 0) return;
  S.items[k]--; B.itemMenu = false;
  if (k === 'heal') { const h = Math.round(B.pMax*0.4); B.pHp = Math.min(B.pMax, B.pHp+h); B.log.push({ c:'heal', t:`你服下回復丹，回復 ${h} 點體力。` }); }
  else if (k === 'mp') { B.pMp = Math.min(100, B.pMp+50); B.log.push({ c:'heal', t:'你服下靈壓丹，回復 50 靈力。' }); }
  else if (k === 'focus') { B.focus = true; B.log.push({ c:'system', t:'你貼上集中符——下一擊必定暴擊，且威力大增。' }); }
  saveS();
  enemyTurn();
}

function hollowMul(){ return B.hollowOn ? 1.6 : 1; }
function lifesteal(dmg){
  if (!B.hollowOn) return;
  const heal = Math.round(dmg * 0.35);
  B.pHp = Math.min(B.pMax, B.pHp + heal);
  B.log.push({ c:'heal', t:`虛面汲取了敵人的靈魂，回復 ${heal} 點體力。` });
}

function act(type){
  if (B.over) return;
  const e = B.enemy;
  if (type === 'basic') {
    let d = playerAtk() * B.atkMul * hollowMul() * rand(0.85,1.15);
    let crit = Math.random() < critChance();
    if (B.focus) { crit = true; d *= 1.7; B.focus = false; }
    if (crit) { d *= 1.6; unlockAch('crit'); }
    d = Math.round(d); e.hp -= d; B.pMp = Math.min(100, B.pMp+8);
    B.log.push({ c:crit?'crit':'you', t:`你揮出${B.hollowOn?'虛面亂舞':(B.form==='sealed'?'一刀':'『曙』')}，造成 ${d} 傷害${crit?'（暴擊！）':''}。` });
    lifesteal(d);
  } else if (type === 'skill') {
    B.pMp -= 25;
    let d = playerAtk() * B.atkMul * hollowMul() * 1.9 * rand(0.9,1.1);
    let crit = Math.random() < critChance();
    if (B.focus) { crit = true; d *= 1.7; B.focus = false; }
    if (crit) { d *= 1.6; unlockAch('crit'); }
    d = Math.round(d); e.hp -= d;
    B.log.push({ c:crit?'crit':'you', t:`你${B.hollowOn?'轟出虛閃（Cero）':'詠唱鬼道・赤火炮'}，造成 ${d} 傷害${crit?'（暴擊！）':''}。` });
    lifesteal(d);
  } else if (type === 'release') {
    B.pMp -= 20; B.releaseUsed = true; B.form = B.bat.release;
    B.atkMul = REL_MULT[B.bat.release]; B.pHp = Math.min(B.pMax, B.pHp+25);
    unlockAch('release');
    B.log.push({ c:'heal', t:`你解放了【${REL_NAME[B.bat.release]}】！攻擊力大幅提升，傷勢也得到回復。` });
  } else if (type === 'hollow') {
    B.pMp -= 30; B.hollowOn = true;
    B.hollowRisky = B.pHp < B.pMax * 0.3;
    B.hollowTurns = 4;
    unlockAch('hollow');
    B.log.push({ c:'crit', t:`你的臉上覆上了【虛面】！靈壓暴漲，攻擊大幅強化，攻擊將汲取敵人靈魂回血——但它撐不了太久。${B.hollowRisky?'（體力低下，虛化反噬將更劇烈！）':''}` });
  } else if (type === 'guard') {
    B.guard = true; B.pMp = Math.min(100, B.pMp+12); B.pHp = Math.min(B.pMax, B.pHp+6);
    B.log.push({ c:'system', t:'你擺出架式，準備抵擋下一擊。' });
  } else if (type === 'dodge') {
    B.dodgePend = true;
    B.log.push({ c:'system', t:'你壓低重心，準備以瞬步閃避。' });
  }
  if (e.hp <= 0) { victory(); return; }
  enemyTurn();
}

function enemyTurn(){
  const e = B.enemy;
  B.turn++;
  let dmg, special = false;
  if (e.charging) {
    dmg = e.atk * e.specialMult; e.charging = false; special = true;
  } else if (e.specialEvery && B.turn % e.specialEvery === 0) {
    e.charging = true;
    B.log.push({ c:'enemy', t:`${e.name} 開始凝聚龐大的靈壓……` });
    dmg = e.atk * 0.4;
  } else {
    dmg = e.atk * rand(0.85,1.15);
  }
  dmg = Math.round(dmg);

  if (B.dodgePend) {
    B.dodgePend = false;
    if (Math.random() < dodgeChance()) {
      B.log.push({ c:'you', t:`你以瞬步閃過了 ${e.name} 的攻擊！` });
      finishRound(); return;
    }
    B.log.push({ c:'system', t:'閃避失敗……' });
  }
  if (B.guard) {
    dmg = Math.round(dmg * 0.35); B.guard = false;
    B.log.push({ c:'enemy', t:`${e.name} ${special?'轟出強力一擊':'發動攻擊'}，被你擋下大半，僅受 ${dmg} 傷害。` });
  } else {
    B.log.push({ c:special?'crit':'enemy', t:`${e.name} ${special?'的強力一擊命中！造成':'攻擊命中，造成'} ${dmg} 傷害。` });
  }
  B.pHp -= dmg;
  B.dmgTaken += dmg;
  if (B.pHp <= 0) { defeat(); return; }
  finishRound();
}

function finishRound(){
  // 虛化 upkeep — duration & backlash
  if (B.hollowOn) {
    B.hollowTurns--;
    if (B.hollowTurns <= 0) {
      B.hollowOn = false;
      const back = Math.round(B.pMax * (B.hollowRisky ? 0.30 : 0.15));
      B.pHp -= back;
      B.hollowCD = 2;
      B.log.push({ c:'system', t:`虛面碎裂——強行虛化的反噬，奪走了 ${back} 點體力。（虛面冷卻中）` });
      if (B.pHp <= 0) { defeat(); return; }
    }
  } else if (B.hollowCD > 0) {
    B.hollowCD--;
    if (B.hollowCD === 0) B.log.push({ c:'system', t:'虛面已可再次解放。' });
  }
  renderBattle();
}

function battleRank(){
  const hpFrac = B.pHp / B.pMax;
  if (B.dmgTaken === 0 || (hpFrac >= 0.7 && B.turn <= 8)) return 'S';
  if (hpFrac >= 0.5) return 'A';
  if (hpFrac >= 0.25) return 'B';
  return 'C';
}
function grantItems(count){
  const pool = ['heal','mp','focus']; const got = {};
  for (let i=0;i<count;i++){ const k = pool[Math.floor(rand(0,3))]; S.items[k]=(S.items[k]||0)+1; got[k]=(got[k]||0)+1; }
  return Object.keys(got).map(k => `${ITEM_INFO[k].name}×${got[k]}`).join('、');
}

function victory(){
  B.over = true;
  renderBattle();
  unlockAch('firstWin');
  if (B.dmgTaken === 0) unlockAch('flawless');
  if (S.difficulty === 'hard') unlockAch('shura');
  const rank = battleRank();
  if (rank === 'S') unlockAch('rankS');

  if (B.bat.arena) { arenaWin(rank); return; }

  const gained = grantItems(rank==='S'?3 : rank==='A'?2 : 1);
  saveS();
  const v = document.createElement('div');
  v.className = 'cb-victory';
  v.innerHTML = `<div class="cb-rank ${rank}">${rank}</div><div style="font-size:16px;font-weight:700;margin-bottom:4px">⚔ 勝　利</div><div style="font-size:13px;line-height:1.7">${B.bat.winText||'你擊敗了敵人！'}</div><div class="cb-reward">獲得道具：${gained}</div>`;
  document.querySelector('.combat').prepend(v);
  const box = document.getElementById('choices'); box.innerHTML = '';
  const btn = document.createElement('button');
  btn.className = 'continue-btn'; btn.textContent = '▶ 繼續';
  btn.onclick = () => { const to = B.win, fx = B.bat.winFx; B = null; if (fx) applyFx(fx); renderNode(to); };
  box.appendChild(btn);
}

function defeat(){
  B.over = true;
  renderBattle();
  if (B.bat.arena) { arenaLose(); return; }
  const d = document.createElement('div');
  d.className = 'cb-defeat';
  d.innerHTML = `<div style="font-size:18px;font-weight:700;margin-bottom:6px">你被擊倒了……</div><div style="font-size:13px;line-height:1.7">但只要還有想守護的人，就不能在此倒下。</div>`;
  document.querySelector('.combat').prepend(d);
  const box = document.getElementById('choices'); box.innerHTML = '';
  const retry = document.createElement('button');
  retry.className = 'continue-btn'; retry.textContent = '↻ 再戰一次';
  retry.onclick = () => startBattle(B.bat, B.win);
  box.appendChild(retry);
  const skip = document.createElement('button');
  skip.className = 'cb-action';
  skip.style.cssText = 'margin-top:10px;width:100%;text-align:center;max-width:780px';
  skip.innerHTML = '<div class="cb-act-name">以劇情之力突破（跳過戰鬥）</div>';
  skip.onclick = () => { const to = B.win, fx = B.bat.winFx; B = null; if (fx) applyFx(fx); renderNode(to); };
  box.appendChild(skip);
}

/* ════════════════════════════════════════════════════════
   虛之修練場（ARENA）— 可反覆挑戰的爬塔戰鬥
════════════════════════════════════════════════════════ */
let arenaTier = 1;
function arenaName(t){ return t<=1?'虛之殘影' : t<=3?'骸骨面' : t<=5?'特大虛' : t<=7?'破面的仿影' : '虛聖の影'; }

function openArena(){
  if (!S.name || !document.getElementById('modal-overlay').classList.contains('hidden')) {
    alert('請先開始遊戲，再進入修練場。'); return;
  }
  const best = ACH_STATE.arenaBest || 0;
  const inv = `<div class="inv-line">持有道具：<b>回復丹 ${S.items.heal||0}</b>・<b>靈壓丹 ${S.items.mp||0}</b>・<b>集中符 ${S.items.focus||0}</b></div>`;
  const opts = [1,3,5,8].map(t =>
    `<div class="arena-opt" onclick="startArena(${t})"><div><div class="ao-name">第 ${t} 階・${arenaName(t)}</div><div class="ao-desc">擊破後可挑戰更高階，難度與獎勵遞增</div></div><div class="ao-tier">${t}</div></div>`).join('');
  showPanel(`<h2>虛之修練場</h2><div class="psub">反覆挑戰虛之化身，磨練戰技、賺取道具。<br>最高紀錄：第 <b style="color:var(--gold)">${best}</b> 階</div>${inv}${opts}<button class="panel-close" onclick="closePanel()">關閉</button>`);
}

function startArena(tier){ arenaTier = tier; closePanel(); launchArenaBattle(); }

function launchArenaBattle(){
  const t = arenaTier;
  const bat = {
    arena: true,
    enemy: { name:`虛之化身・第${t}階（${arenaName(t)}）`, hp:Math.round(110 + t*72), atk:11 + t*4.6,
             specialMult:2.2 + t*0.04, specialEvery:3, special:'虛閃亂舞' },
    release: S.zanState !== 'sealed' ? S.zanState : null,
    intro: `虛之修練場・第 ${t} 階——${arenaName(t)} 現身！`,
  };
  startBattle(bat, '__arena__');
}

function arenaWin(rank){
  const t = arenaTier;
  ACH_STATE.arenaBest = Math.max(ACH_STATE.arenaBest||0, t); saveAch();
  if (t >= 5) unlockAch('arena5');
  const gained = grantItems(1 + Math.floor(t/2) + (rank==='S'?2 : rank==='A'?1 : 0));
  saveS();
  const v = document.createElement('div');
  v.className = 'cb-victory';
  v.innerHTML = `<div class="cb-rank ${rank}">${rank}</div><div style="font-size:16px;font-weight:700;margin-bottom:4px">⚔ 第 ${t} 階 突破！</div><div class="cb-reward">獲得道具：${gained}</div>`;
  document.querySelector('.combat').prepend(v);
  const box = document.getElementById('choices'); box.innerHTML = '';
  const next = document.createElement('button');
  next.className = 'continue-btn'; next.textContent = `▶ 挑戰第 ${t+1} 階`;
  next.onclick = () => { arenaTier = t+1; launchArenaBattle(); };
  box.appendChild(next);
  box.appendChild(arenaLeaveBtn());
}

function arenaLose(){
  const t = arenaTier;
  const d = document.createElement('div');
  d.className = 'cb-defeat';
  d.innerHTML = `<div style="font-size:18px;font-weight:700;margin-bottom:6px">在第 ${t} 階倒下了……</div><div style="font-size:13px">但這只是修練。整頓旗鼓，再來挑戰吧。</div>`;
  document.querySelector('.combat').prepend(d);
  const box = document.getElementById('choices'); box.innerHTML = '';
  const retry = document.createElement('button');
  retry.className = 'continue-btn'; retry.textContent = `↻ 重試第 ${t} 階`;
  retry.onclick = () => launchArenaBattle();
  box.appendChild(retry);
  box.appendChild(arenaLeaveBtn());
}

function arenaLeaveBtn(){
  const leave = document.createElement('button');
  leave.className = 'cb-action';
  leave.style.cssText = 'margin-top:10px;width:100%;text-align:center;max-width:780px';
  leave.innerHTML = '<div class="cb-act-name">離開修練場</div>';
  leave.onclick = () => { B = null; renderNode(S.node); };
  return leave;
}

/* ── 面板（成就 / 修練場）── */
function showPanel(html){ document.getElementById('panel-body').innerHTML = html; document.getElementById('panel-overlay').classList.remove('hidden'); }
function closePanel(){ document.getElementById('panel-overlay').classList.add('hidden'); }
function openAchievements(){
  ACH_STATE = loadAch();
  const done = ACHIEVEMENTS.filter(a => ACH_STATE[a.id]).length;
  const list = ACHIEVEMENTS.map(a => {
    const u = !!ACH_STATE[a.id];
    return `<div class="ach-item ${u?'':'locked'}"><div class="ach-icon">${u?a.icon:'🔒'}</div><div class="ach-body"><div class="ach-title">${a.title}</div><div class="ach-desc">${a.desc}</div></div>${u?'<div class="ach-done">✓ 達成</div>':''}</div>`;
  }).join('');
  showPanel(`<h2>成　就</h2><div class="psub">已解鎖 <b style="color:var(--accent2)">${done}</b> / ${ACHIEVEMENTS.length}（跨周目永久保存）</div>${list}<button class="panel-close" onclick="closePanel()">關閉</button>`);
}

function choose(ch) {
  if (ch.to === '__restart__') { doRestart(); return; }
  if (ch.to === '__summary__') { showSummary(1); return; }
  if (ch.to === '__summary2__') { showSummary(2); return; }
  if (ch.to === '__summary3__') { showSummary(3); return; }
  if (ch.to === '__summary4__') { showSummary(4); return; }
  if (ch.to === '__summary5__') { showSummary(5); return; }
  if (ch.to === '__summary6__') { showSummary(6); return; }
  if (ch.to === '__summary7__') { showSummary(7); return; }
  applyFx(ch.fx, ch.flag);
  renderNode(ch.to);
}

/* ════════════════════════════════════════════════════════
   SIDEBAR
════════════════════════════════════════════════════════ */
function updateSidebar(node) {
  setText('char-name', S.name || '——');
  setText('char-meta', S.charMeta);
  setText('char-badge', S.badge);
  bar('hp', S.hp); bar('mp', S.mp); bar('sta', S.sta);

  setText('reiatsu-num', S.reiatsu);
  let rl = '沉睡的靈魂';
  for (const [thr, lab] of REIATSU_LABELS) { if (S.reiatsu <= thr) { rl = lab; break; } }
  setText('reiatsu-label', rl);

  // zanpakuto card
  if (S.zanName) {
    document.getElementById('zan-card').style.display = '';
    setText('zan-name', S.zanName);
    const zs = document.getElementById('zan-state');
    zs.className = 'zan-state ' + (S.zanState || 'sealed');
    zs.textContent = { sealed:'封印', shikai:'始解', bankai:'卍解', true:'真・卍解' }[S.zanState] || '封印';
  } else {
    document.getElementById('zan-card').style.display = 'none';
  }

  document.getElementById('hollow-card').style.display = S.hollowUnlocked ? '' : 'none';

  setText('t-courage', S.courage);
  setText('t-calm', S.calm);
  setText('t-sense', S.sense);
  const bondIdx = Math.min(BOND_LABELS.length - 1, Math.floor(S.bond / 2));
  setText('t-bond', S.bond === 0 ? '陌生' : BOND_LABELS[bondIdx]);

  // progress track
  const track = document.getElementById('progress-track');
  const chNum = node.chapter || 1;
  const labels = CHAPTERS[chNum] || CHAPTERS[1];
  const cur = node.progress !== undefined ? node.progress : 0;
  track.innerHTML = labels.map((lab, i) => {
    const cls = i < cur ? 'done' : i === cur ? 'current' : '';
    return `<div class="pnode ${cls}"><span class="pmark"></span><span class="ptext">${lab}</span></div>`;
  }).join('');
}

function bar(id, pct) {
  pct = Math.max(0, Math.min(100, pct));
  document.getElementById('bar-' + id).style.width = pct + '%';
  document.getElementById('val-' + id).textContent = pct + '%';
}
function setText(id, v) { const e = document.getElementById(id); if (e) e.textContent = v; }

/* ════════════════════════════════════════════════════════
   SUMMARY
════════════════════════════════════════════════════════ */
function showSummary(chapter) {
  const story = document.getElementById('story');
  const f = S.flags;
  const bondLabel = S.bond === 0 ? '陌生' : BOND_LABELS[Math.min(4, Math.floor(S.bond/2))];

  let title, lines;

  if (chapter === 7) {
    let style;
    if (f.c7_control) style = '【人虛共存】你沒有壓制內在之虛，而是與它達成共存——力量與理智並行不悖。';
    else if (f.c7_dominate) style = '【絕對支配】你以壓倒性的意志制伏了內在之虛，讓它徹底臣服於你的掌控。';
    else style = '【直面內心】你正視了靈魂深處的黑暗，並將它化為己用。';

    title = '第七章 · 旅程總結';
    lines = `
      <p class="narration"><span class="emph">${S.name}</span> 的覺醒之路</p>
      <p class="narration">▸ 內心之戰：<span class="emph">${style}</span></p>
      <p class="narration">▸ 當前靈壓：<span class="emph">${S.reiatsu}</span></p>
      <p class="narration">▸ 力量：<span class="emph">真・卍解「曙・天照」</span> ＋ <span style="color:#c878e0">虛面（虛化）</span></p>
      <p class="narration">▸ 與凛的羈絆：<span class="emph">${bondLabel}</span></p>
      <p class="thought">你戰勝了內在之虛，掌握了介於死神與虛之間的「虛面」之力。但一名來自靈王宮彼端的「闇之使者」現身，預示著更黑暗的戰爭即將降臨。</p>
      <p class="thought">真正的敵人，仍沉睡在世界的盡頭。而你的旅程，未完待續。</p>`;
  } else if (chapter === 6) {
    let style;
    if (f.c6_shieldAll) style = '【天照之盾】你的真・卍解，化作守護三界的光，不容任何黑暗染指所愛之人。';
    else if (f.c6_wrath) style = '【裁decisive斷之光】你以煌天輪的烈焰，親手終結了那場褻瀆生死的陰謀。';
    else style = '【破曉之刃】縱使對手已非人非神，你依然斬開了長夜，迎來黎明。';
    style = style.replace('decisive','');

    title = '第六章 · 最終旅程總結';
    lines = `
      <p class="narration"><span class="emph">${S.name}</span> 的終焉之路</p>
      <p class="narration">▸ 戰鬥之姿：<span class="emph">${style}</span></p>
      <p class="narration">▸ 最終靈壓：<span class="emph">${S.reiatsu}</span>（真・卍解・超越隊長）</p>
      <p class="narration">▸ 斬魄刀：<span class="emph">曙・天照</span>（真・卍解）</p>
      <p class="narration">▸ 與凛的羈絆：<span class="emph">${bondLabel}</span></p>
      <p class="thought">你橫越了白色沙漠，攻破了虛夜白塔，從綾小路冥手中救回了茜，並以真・卍解終結了那場褻瀆生死的陰謀。</p>
      <p class="thought">但綾小路臨終的低語，揭示了一個更深的黑暗——「沉睡在靈王宮彼端的存在，即將甦醒」。真正的戰爭，或許才剛要開始。</p>`;
  } else if (chapter === 5) {
    title = '第五章 · 旅程總結';
    lines = `
      <p class="narration"><span class="emph">${S.name}</span> 的越界之路</p>
      <p class="narration">▸ 當前靈壓：<span class="emph">${S.reiatsu}</span></p>
      <p class="narration">▸ 斬魄刀：<span class="emph">${S.zanName || '—'}</span>（${ {sealed:'封印',shikai:'始解',bankai:'卍解','true':'真・卍解'}[S.zanState] }）</p>
      <p class="narration">▸ 與凛的羈絆：<span class="emph">${bondLabel}</span></p>
      <p class="thought">破面的襲擊、茜的被擄，迫使你跨越虛界之門，踏入了那片永夜的白色沙漠。虛夜白塔，就在眼前。</p>`;
  } else if (chapter === 4) {
    let style;
    if (f.c4_shieldRin) style = '【守護之劍】你的卍解，不為殺戮，只為守護身後之人而出鞘。';
    else if (f.c4_overwhelm) style = '【壓倒之力】你以絕對的力量碾碎了一切阻擋——這就是覺醒的代價與榮耀。';
    else style = '【不屈之刃】縱使對手是隊長，你也從未想過後退半步。';

    title = '第四章 · 旅程總結';
    lines = `
      <p class="narration"><span class="emph">${S.name}</span> 的奪還之路</p>
      <p class="narration">▸ 戰鬥之姿：<span class="emph">${style}</span></p>
      <p class="narration">▸ 最終靈壓：<span class="emph">${S.reiatsu}</span>（卍解・隊長級）</p>
      <p class="narration">▸ 斬魄刀：<span class="emph">${S.zanName || '—'}</span>（卍解・煌天輪）</p>
      <p class="narration">▸ 與凛的羈絆：<span class="emph">${bondLabel}</span></p>
      <p class="thought">你斬碎了白羽的刀、揭穿了綾小路冥的陰謀、在斷魂台前奪回了霜月凛。一場震動靈廷的救援，就此落幕。</p>
      <p class="thought">但那名遁入暗影的隊長，以及他背後更龐大的存在……三界的風暴，仍未平息。</p>`;
  } else if (chapter === 3) {
    title = '第三章 · 旅程總結';
    lines = `
      <p class="narration"><span class="emph">${S.name}</span> 的潛入之路</p>
      <p class="narration">▸ 當前靈壓：<span class="emph">${S.reiatsu}</span></p>
      <p class="narration">▸ 斬魄刀：<span class="emph">${S.zanName || '—'}</span>（${ {sealed:'封印',shikai:'始解',bankai:'卍解'}[S.zanState] }）</p>
      <p class="narration">▸ 與凛的羈絆：<span class="emph">${bondLabel}</span></p>
      <p class="thought">你墜入流魂街，結識了並肩的夥伴，聽見了斬魄刀真正的名字，並一舉突破了靈廷的高牆。</p>`;
  } else if (chapter === 2) {
    let style;
    if (f.c2_shield) style = '【盾・以身為牆】面對壓倒性的強敵，你仍選擇擋在她身前。守護，是你的本能。';
    else if (f.c2_read) style = '【眼・洞見破綻】即使必敗，你也要在強者身上留下一道傷。你的雙眼，看得見未來。';
    else if (f.c2_rush) style = '【刃・先發制人】你從不等待命運降臨，而是主動揮刀斬向它。';
    else if (f.c2_reachRin) style = '【絆・至死方休】在生命的最後一刻，你伸向的不是生路，而是她。';
    else style = '【韌・不屈之魂】你被擊倒，卻從未被擊敗。倒下的姿勢，也朝著前方。';

    let resolveText = S.bond >= 4 ? '為了奪回霜月凛，你願意走進那座連死神都畏懼的尸魂界。' :
                      '一段未竟的契約，驅使你踏向未知的尸魂界。';

    title = '第二章 · 旅程總結';
    lines = `
      <p class="narration"><span class="emph">${S.name}</span> 的試煉之路</p>
      <p class="narration">▸ 面對使者的姿態：<span class="emph">${style}</span></p>
      <p class="narration">▸ 當前靈壓：<span class="emph">${S.reiatsu}</span>（真正的力量，正在甦醒）</p>
      <p class="narration">▸ 勇氣 <span class="emph">${S.courage}</span> ・ 冷靜 <span class="emph">${S.calm}</span> ・ 靈感 <span class="emph">${S.sense}</span></p>
      <p class="narration">▸ 與凛的羈絆：<span class="emph">${bondLabel}</span></p>
      <p class="thought">${resolveText}</p>
      <p class="thought">你在絕望中嘗到了強者與弱者的鴻溝，也在黑暗中接住了一隻引路的手。下一站——尸魂界。</p>`;
  } else {
    let style;
    if (f.fullResolve) style = '【烈・捨身之魂】你毫不猶豫地擁抱了力量與責任，是天生的戰士。';
    else if (f.tookHit) style = '【義・以身擋刃】你願為素昧平生之人流血，擁有最珍貴的俠義之心。';
    else if (f.cleverDodge) style = '【智・冷眼算路】你在絕境中依然冷靜，是少見的智將之才。';
    else if (f.vow) style = '【誓・並肩之心】你選擇守護那個守護你的人，羈絆將是你最強的武器。';
    else style = '【靜・自有定見】你以自己的節奏面對未知，沉穩而堅定。';

    let bondText = S.bond >= 4 ? '霜月凛已將你視為可以託付後背的夥伴。' :
                   S.bond >= 2 ? '霜月凛開始對你另眼相看。' :
                   '霜月凛還在觀察這個古怪的人類。';

    title = '第一章 · 旅程總結';
    lines = `
      <p class="narration"><span class="emph">${S.name}</span> 的覺醒之路</p>
      <p class="narration">▸ 戰鬥風格：<span class="emph">${style}</span></p>
      <p class="narration">▸ 當時靈壓：<span class="emph">480</span>（代理死神級）</p>
      <p class="narration">▸ 勇氣 <span class="emph">${S.courage}</span> ・ 冷靜 <span class="emph">${S.calm}</span> ・ 靈感 <span class="emph">${S.sense}</span></p>
      <p class="narration">▸ 與凛的羈絆：<span class="emph">${bondLabel}</span> — ${bondText}</p>
      <p class="thought">你拯救了一個迷途的靈魂，斬碎了第一隻虛，並與一名死神締結了改變命運的契約。這只是漫長旅途的第一步。</p>`;
  }

  story.innerHTML = `
    <div class="scene-text fade-in">
      <div class="chapter-tag">JOURNEY SUMMARY</div>
      <h2>${title}</h2>
      ${lines}
      <hr style="border:none;border-top:1px solid var(--border);margin:18px 0">
      <p class="narration" style="text-align:center;color:var(--text-dim)">${chapter === 7 ? '第三部「靈王篇」・序章。<br>更黑暗的戰爭，即將揭幕。' : chapter === 6 ? '第二部「虛圈篇」・完結。<br>感謝你陪伴 ' + S.name + ' 走過這場橫跨三界的旅程。' : chapter === 4 ? '第一部「救援篇」・完結。' : '感謝你的遊玩。'}</p>
    </div>`;
  const box = document.getElementById('choices');
  box.innerHTML = '';
  const btn = document.createElement('button');
  btn.className = 'continue-btn';
  btn.textContent = '↺ 重新踏上旅程';
  btn.onclick = doRestart;
  box.appendChild(btn);
}

/* ════════════════════════════════════════════════════════
   RESET
════════════════════════════════════════════════════════ */
function doRestart() {
  const name = S.name;
  const diff = S.difficulty || 'normal';
  S = { name, hp:100, mp:100, sta:100, reiatsu:15, courage:0, calm:0, sense:0, bond:0,
        badge:'尚未覺醒', charMeta:'人類・空座町高中生', zanName:null, zanState:'sealed',
        hollowUnlocked:false, difficulty:diff, items:{ heal:2, mp:2, focus:1 },
        flags:{}, node:'c1_00', visited:[] };
  localStorage.setItem('bleach_story_save', JSON.stringify(S));
  renderNode('c1_00');
}

function confirmReset() {
  if (confirm('確定要重新開始第一章嗎？目前進度將清除。')) {
    localStorage.removeItem('bleach_story_save');
    location.reload();
  }
}

/* ════════════════════════════════════════════════════════
   INIT
════════════════════════════════════════════════════════ */
window.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('bleach_story_save');
  if (saved) {
    try {
      const data = JSON.parse(saved);
      if (data && data.name && data.node && STORY[data.node]) {
        S = data;
        if (!S.items) S.items = { heal:2, mp:2, focus:1 };
        if (!S.difficulty) S.difficulty = 'normal';
        document.getElementById('modal-overlay').classList.add('hidden');
        renderNode(S.node);
        return;
      }
    } catch(e) {}
  }
  document.getElementById('name-input').focus();
  document.getElementById('name-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') startGame();
  });
});
</script>
